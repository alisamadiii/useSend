name: Publish Docker

# One image tag per branch, so every client instance stays isolated.
#   agency branch          -> ghcr.io/alisamadiii/usesend:agency
#   client/empowerher      -> ghcr.io/alisamadiii/usesend:client-empowerher
# Each Coolify instance pins its own branch tag. Push the branch -> image rebuilds
# under that same tag -> Redeploy in Coolify. No :latest, so builds never clobber.

on:
  push:
    branches:
      - agency
      - "client/**"
  workflow_dispatch:

jobs:
  build_and_publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the docker image
        run: |
          # Branch name -> a safe docker tag (client/empowerher -> client-empowerher)
          BRANCH_TAG="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          GIT_SHA="$(git rev-parse --short HEAD)"
          IMAGE="ghcr.io/alisamadiii/usesend"

          echo "Building ${IMAGE}:${BRANCH_TAG} (sha ${GIT_SHA})"

          docker build \
            -f ./docker/Dockerfile \
            --progress=plain \
            --build-arg APP_VERSION="${BRANCH_TAG}" \
            --build-arg GIT_SHA="${GIT_SHA}" \
            -t "${IMAGE}:${BRANCH_TAG}" \
            -t "${IMAGE}:${BRANCH_TAG}-${GIT_SHA}" \
            .

          docker push "${IMAGE}:${BRANCH_TAG}"
          docker push "${IMAGE}:${BRANCH_TAG}-${GIT_SHA}"
