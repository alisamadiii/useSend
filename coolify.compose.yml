# Coolify deploy for the agency fork. No registry: Coolify clones this repo
# and builds docker/Dockerfile on the VPS on every deploy.
#
# Coolify setup: New resource -> Application -> Git (this repo, branch
# `agency`) -> Build pack "Docker Compose" -> compose file `/coolify.compose.yml`.
# Set the domain on the `usesend` service (port 3000). Secrets go in Coolify's
# env UI; `${VAR:-}` entries below show up there automatically.
#
# Postgres data lives in the `usesend-postgres-data` volume. Coolify prefixes it
# with the app uuid, so a fresh app starts with an empty DB. To keep the data of
# the old ghcr-based service, pg_dump it and restore into the new container.

services:
  usesend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: agency
        GIT_SHA: ${SOURCE_COMMIT:-unknown}
    environment:
      - SERVICE_FQDN_USESEND_3000
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXTAUTH_URL=${SERVICE_URL_USESEND}
      - NEXTAUTH_SECRET=${SERVICE_BASE64_64_NEXTAUTHSECRET}
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/usesend
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_IS_CLOUD=false
      - API_RATE_LIMIT=${API_RATE_LIMIT:-2}
      # Instance-admin secret for the workspace provisioning API (client-hub)
      - USESEND_ADMIN_API_KEY=${USESEND_ADMIN_API_KEY:-}
      # Email/password auth (no GitHub OAuth)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
      # AWS SES (us-west-2 is the production region)
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
      # Optional
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - EMAIL_CLEANUP_DAYS=${EMAIL_CLEANUP_DAYS:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Generous start_period: start.sh runs prisma migrate before Next boots.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=usesend
    volumes:
      - usesend-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usesend"]
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    volumes:
      - usesend-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  usesend-postgres-data:
  usesend-redis-data:
